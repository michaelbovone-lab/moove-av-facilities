<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moove AV — Facilities Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --surface2: #1e2330;
    --border: #2a3045;
    --accent: #5cffd6;
    --accent2: #ff6b6b;
    --accent3: #ffcc44;
    --text: #e8ecf4;
    --muted: #6b7591;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: 4px;
  }

  .header-right { margin-left: auto; }

  .total-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--muted);
  }

  .total-badge strong { color: var(--accent); }

  .controls {
    display: flex;
    gap: 10px;
    padding: 20px 32px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 340px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px 9px 36px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0f14; font-weight: 500; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 28px 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    cursor: pointer;
    animation: fadeUp 0.4s ease both;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    border-color: var(--accent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 18px 20px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
  }

  .site-name { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .site-short { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 0.06em; text-transform: uppercase; }

  .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

  .badge {
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .badge-status-Active      { background: rgba(92,255,214,0.12); color: var(--accent); border: 1px solid rgba(92,255,214,0.25); }
  .badge-status-Construction{ background: rgba(255,204,68,0.12);  color: var(--accent3); border: 1px solid rgba(255,204,68,0.25); }
  .badge-status-Confidential{ background: rgba(255,107,107,0.12); color: var(--accent2); border: 1px solid rgba(255,107,107,0.25); }
  .badge-status-default     { background: rgba(107,117,145,0.15); color: var(--muted); border: 1px solid var(--border); }
  .badge-type               { background: rgba(107,117,145,0.1);  color: var(--muted); border: 1px solid var(--border); }

  .card-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

  .info-row { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; }
  .info-label { color: var(--muted); min-width: 68px; flex-shrink: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
  .info-value { color: var(--text); line-height: 1.4; }

  .market-pill {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.06em;
  }

  .tasks-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  .task-chip {
    background: var(--surface2);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10.5px;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .card-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }

  .contact-name { color: var(--text); font-size: 12px; }

  .no-results { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }

  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    overflow-y: auto;
    padding: 40px 20px;
    backdrop-filter: blur(6px);
  }

  .detail-overlay.open { display: flex; justify-content: center; align-items: flex-start; }

  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 640px;
    overflow: hidden;
    animation: fadeUp 0.25s ease;
  }

  .detail-head {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .detail-title { font-family: var(--font-head); font-size: 26px; font-weight: 800; }

  .close-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .close-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .detail-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .detail-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 10px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .detail-item label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }
  .detail-item span  { font-size: 13px; color: var(--text); line-height: 1.4; }

  .detail-divider { border: none; border-top: 1px solid var(--border); }

  /* ── Hamburger + nav drawer ── */
  .hamburger {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 40px; height: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; flex-shrink: 0; transition: border-color 0.15s;
  }
  .hamburger:hover { border-color: var(--accent); }
  .hamburger span { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; }

  .nav-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; backdrop-filter: blur(3px);
  }
  .nav-backdrop.open { display: block; }
  .nav-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 270px; max-width: 82vw;
    background: var(--surface); border-right: 1px solid var(--border);
    z-index: 301; transform: translateX(-100%); transition: transform 0.22s ease;
    display: flex; flex-direction: column; padding: 22px 0;
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-brand { font-family: var(--font-head); font-weight: 800; font-size: 18px; color: var(--accent); padding: 0 24px 18px; }
  .nav-brand span { color: var(--text); }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 24px;
    font-size: 14px; color: var(--muted); cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
  .nav-item svg { flex-shrink: 0; }

  /* ── PIR Directory ── */
  .pir-wrap { padding: 28px 32px; }
  .pir-intro { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.5; max-width: 72ch; }
  .pir-group { margin-bottom: 22px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .pir-group-head {
    display: flex; align-items: center; gap: 12px; padding: 15px 20px; cursor: pointer;
    background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  .pir-group-head .pir-name { font-family: var(--font-head); font-size: 17px; font-weight: 700; color: var(--text); }
  .pir-group-head .pir-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .pir-count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 11px; }
  .pir-chevron { transition: transform 0.2s; color: var(--muted); }
  .pir-group.collapsed .pir-chevron { transform: rotate(-90deg); }
  .pir-group.collapsed table { display: none; }
  .pir-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .pir-table th { text-align: left; padding: 9px 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; }
  .pir-table td { padding: 10px 20px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  .pir-table tr:last-child td { border-bottom: none; }
  .pir-table tr:hover td { background: var(--surface2); }
  .pir-fac { font-weight: 500; }
  .pir-fac small { display: block; color: var(--muted); font-weight: 400; font-size: 10.5px; letter-spacing: 0.04em; }
  .pir-value { white-space: pre-line; }
  .pir-unset { color: var(--muted); font-style: italic; }
  .pir-mkt { display:inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 8px; font-size: 11px; color: var(--accent); }
</style>
</head>

</div>

let activeMarket = "All", activeStatus = "All", activeType = "All", searchQ = "";

function statusClass(s) {
  const map = {"Active":"badge-status-Active","Construction":"badge-status-Construction","Confidential":"badge-status-Confidential"};
  return map[s] || "badge-status-default";
}

// Canonical Site Types — always offered in the Type filter even before any
// site is tagged with them (union'd with whatever types the data actually uses).
const SITE_TYPES = ["Depot", "Pitstop", "Off-hail"];

function makeFilters() {
  const markets  = ["All", ...new Set(sites.map(s=>s.market).filter(m=>m&&m!=="—"))];
  const statuses = ["All", ...new Set(sites.map(s=>s.status).filter(s=>s&&s!=="—"))];
  const types    = ["All", ...new Set([...SITE_TYPES, ...sites.map(s=>s.type).filter(t=>t&&t!=="—")])];

  document.getElementById('marketFilters').innerHTML = markets.map(v=>
    `<button class="filter-btn ${activeMarket===v?'active':''}" onclick="setMarket('${v}')">${v}</button>`).join('');
  document.getElementById('statusFilters').innerHTML = statuses.map(v=>
    `<button class="filter-btn ${activeStatus===v?'active':''}" onclick="setStatus('${v}')">${v}</button>`).join('');
  document.getElementById('typeFilters').innerHTML = types.map(v=>
    `<button class="filter-btn ${activeType===v?'active':''}" onclick="setType('${v}')">${v}</button>`).join('');
}

window.setMarket = v => { activeMarket = v; render(); };
window.setStatus = v => { activeStatus = v; render(); };
window.setType   = v => { activeType   = v; render(); };

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase(); render();
});

function filtered() {
  return sites.filter(s => {
    const matchSearch = !searchQ || [s.name,s.short,s.longName,s.market,s.address,s.type,s.status,s.gm].join(' ').toLowerCase().includes(searchQ);
    const matchMarket = activeMarket==="All" || s.market===activeMarket;
    const matchStatus = activeStatus==="All" || s.status===activeStatus;
    const matchType   = activeType==="All"   || s.type===activeType;
    return matchSearch && matchMarket && matchStatus && matchType;
  });
}

function render() {
  makeFilters();
  const data = filtered();
  document.getElementById('countBadge').innerHTML = `<strong>${data.length}</strong> Sites`;
  const grid = document.getElementById('grid');

  if (!data.length) {
    grid.innerHTML = '<div class="no-results">No sites match your filters.</div>';
    return;
  }

  grid.innerHTML = data.map((s, i) => {
    const statusCls = statusClass(s.status);
    const shownTasks = s.tasks.slice(0, 4);
    const moreTasks  = s.tasks.length - 4;
    return `
    <div class="card" style="animation-delay:${i*0.04}s" onclick="openDetail(${sites.indexOf(s)})">
      <div class="card-header">
        <div>
          <div class="site-name">${s.name}</div>
          <div class="site-short">${s.short} · ${s.longName}</div>
        </div>
        <div class="badges">
          <span class="badge ${statusCls}">${s.status||'—'}</span>
          ${s.type&&s.type!=='—'?`<span class="badge badge-type">${s.type}</span>`:''}
        </div>
      </div>
      <div class="card-body">
        ${s.market&&s.market!=='—'?`<div class="info-row"><span class="info-label">Market</span><span class="info-value"><span class="market-pill">${s.market}</span></span></div>`:''}
        ${s.address&&s.address!=='—'?`<div class="info-row"><span class="info-label">Address</span><span class="info-value">${s.address}</span></div>`:''}
        ${s.inService&&s.inService!=='—'?`<div class="info-row"><span class="info-label">In Service</span><span class="info-value">${s.inService}</span></div>`:''}
        ${s.tasks.length?`
        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;">On-Site Tasks</div>
          <div class="tasks-list">
            ${shownTasks.map(t=>`<span class="task-chip">${t}</span>`).join('')}
            ${moreTasks>0?`<span class="task-chip" style="color:var(--accent)">+${moreTasks} more</span>`:''}
          </div>
        </div>`:''}
      </div>
      <div class="card-footer">
        <div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">General Manager</div>
          <div class="contact-name">${s.gm}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Partner</div>
          <div class="contact-name">${s.partner}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.openDetail = idx => {
  const s = sites[idx];
  document.getElementById('dTitle').textContent = s.name;
  document.getElementById('dShort').textContent = `${s.short} · ${s.longName}`;
  const statusCls = statusClass(s.status);
  document.getElementById('dBody').innerHTML = `
    <div>
      <div class="detail-section-title">Site Info</div>
      <div class="detail-grid">
        <div class="detail-item"><label>Status</label><span><span class="badge ${statusCls}">${s.status||'—'}</span></span></div>
        <div class="detail-item"><label>Type</label><span>${s.type||'—'}</span></div>
        <div class="detail-item"><label>Market</label><span>${s.market||'—'}</span></div>
        <div class="detail-item"><label>In Service</label><span>${s.inService||'—'}</span></div>
        <div class="detail-item" style="grid-column:1/-1"><label>Address</label><span>${s.address||'—'}</span></div>
        <div class="detail-item"><label>Lease Owner</label><span>${s.leaseOwner||'—'}</span></div>
        <div class="detail-item"><label>Partner</label><span>${s.partner||'—'}</span></div>
        ${s.lat?`<div class="detail-item"><label>Latitude</label><span>${s.lat}</span></div><div class="detail-item"><label>Longitude</label><span>${s.lng}</span></div>`:''}
        ${s.eap?`<div class="detail-item" style="grid-column:1/-1"><label>EAP</label><span>${s.eap}</span></div>`:''}
      </div>
    </div>
    <hr class="detail-divider"/>
    <div>
      <div class="detail-section-title">Contacts</div>
      <div class="detail-grid">
        <div class="detail-item"><label>General Manager</label><span>${s.gm||'—'}</span></div>
        <div class="detail-item"><label>Safety Manager</label><span>${s.safetyMgr||'—'}${s.safetyPhone?`<br><span style="color:var(--muted)">${s.safetyPhone}</span>`:''}</span></div>
      </div>
    </div>
    ${s.fire||s.police||s.hospital?`
    <hr class="detail-divider"/>
    <div>
      <div class="detail-section-title">Emergency Services</div>
      <div class="detail-grid">
        ${s.fire?`<div class="detail-item" style="grid-column:1/-1"><label>🔥 Fire Department</label><span style="white-space:pre-line">${s.fire}</span></div>`:''}
        ${s.police?`<div class="detail-item" style="grid-column:1/-1"><label>🚔 Police</label><span style="white-space:pre-line">${s.police}</span></div>`:''}
        ${s.hospital?`<div class="detail-item" style="grid-column:1/-1"><label>🏥 Hospital</label><span style="white-space:pre-line">${s.hospital}</span></div>`:''}
      </div>
    </div>`:''}
    ${s.tasks.length?`
    <hr class="detail-divider"/>
    <div>
      <div class="detail-section-title">On-Site Tasks (${s.tasks.length})</div>
      <div class="tasks-list">${s.tasks.map(t=>`<span class="task-chip">${t}</span>`).join('')}</div>
    </div>`:''}
  `;
  document.getElementById('overlay').classList.add('open');
};

window.closeDetail = () => document.getElementById('overlay').classList.remove('open');

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeDetail();
});

/* ── PIR Directory ── */
const PIR_TYPES = [
  { key:"weapons",      label:"Weapons / Firearm",                  icon:"🔫", contact:"Police (Emergency & Non-Emergency) · Weapons vendor", source:"police" },
  { key:"hazmat",       label:"HazMat Materials / Equipment",       icon:"☣️", contact:"HazMat removal vendor · Fire / 911 · Poison Control", source:"fire" },
  { key:"illicit",      label:"Illicit Substances / Paraphernalia", icon:"💊", contact:"Illicit cleanup vendor (Class A / B) · Poison Control", source:null },
  { key:"suspicious",   label:"Suspicious Package / Device",        icon:"📦", contact:"Police / 911 / EOD · Device vendor", source:"police" },
  { key:"sharps",       label:"Syringe / Sharps",                   icon:"💉", contact:"Sharps / biohazard vendor", source:null },
  { key:"animals",      label:"Unattended Animals",                 icon:"🐾", contact:"Animal control vendor", source:null },
  { key:"unauthorized", label:"Unauthorized Person",                icon:"🚷", contact:"Police · Site security", source:"police" },
  { key:"pest",         label:"Vehicle Pest Infestation",           icon:"🐛", contact:"Pest & biohazard vendor", source:null },
];
const firstLine = t => String(t||"").split("\n")[0].trim();
function pirValue(s, t) {
  if (s.pir && s.pir[t.key]) return s.pir[t.key];        // per-facility override (fill these in)
  if (t.source && s[t.source]) return firstLine(s[t.source]); // fall back to the mapped emergency contact
  return "";
}
const pirSites = () => sites.filter(s => s.name && s.name !== "—");
const CHEVRON = '<svg class="pir-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
let pirGroupMode = 'location';

// Grouped by LOCATION: each facility lists its PIR lookup contacts.
function renderPirByLocation() {
  const list = pirSites();
  document.getElementById('pirGroups').innerHTML = list.map((s, i) => {
    const rows = PIR_TYPES.map(t => {
      const v = pirValue(s, t);
      return `<tr>
        <td class="pir-fac"><span style="margin-right:6px">${t.icon}</span>${t.label}<small>${t.contact}</small></td>
        <td class="pir-value">${v ? v : '<span class="pir-unset">— not set —</span>'}</td>
      </tr>`;
    }).join('');
    const setCount = PIR_TYPES.filter(t => pirValue(s, t)).length;
    return `<div class="pir-group" id="pl-${i}">
      <div class="pir-group-head" onclick="document.getElementById('pl-${i}').classList.toggle('collapsed')">
        <div>
          <div class="pir-name">${s.name}</div>
          <div class="pir-sub">${s.short}${s.market&&s.market!=='—'?' · '+s.market:''}${s.type&&s.type!=='—'?' · '+s.type:''}</div>
        </div>
        <span class="pir-count">${setCount}/${PIR_TYPES.length} set</span>
        ${CHEVRON}
      </div>
      <table class="pir-table">
        <thead><tr><th>PIR type</th><th>PIR contact / vendor</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

// Grouped by PIR TYPE: each PIR lists every facility and its contact.
function renderPirByType() {
  const list = pirSites();
  document.getElementById('pirGroups').innerHTML = PIR_TYPES.map(t => {
    const rows = list.map(s => {
      const v = pirValue(s, t);
      return `<tr>
        <td class="pir-fac">${s.name}<small>${s.short}${s.longName&&s.longName!=='—'?' · '+s.longName:''}</small></td>
        <td>${s.market&&s.market!=='—'?`<span class="pir-mkt">${s.market}</span>`:'—'}</td>
        <td>${s.type&&s.type!=='—'?s.type:'—'}</td>
        <td class="pir-value">${v ? v : '<span class="pir-unset">— not set —</span>'}</td>
      </tr>`;
    }).join('');
    const setCount = list.filter(s => pirValue(s, t)).length;
    return `<div class="pir-group" id="pg-${t.key}">
      <div class="pir-group-head" onclick="document.getElementById('pg-${t.key}').classList.toggle('collapsed')">
        <span style="font-size:18px">${t.icon}</span>
        <div>
          <div class="pir-name">${t.label}</div>
          <div class="pir-sub">${t.contact}</div>
        </div>
        <span class="pir-count">${setCount}/${list.length} set</span>
        ${CHEVRON}
      </div>
      <table class="pir-table">
        <thead><tr><th>Facility</th><th>Market</th><th>Type</th><th>PIR contact / vendor</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function renderPirDir() {
  if (pirGroupMode === 'location') renderPirByLocation(); else renderPirByType();
  const n = pirGroupMode === 'location' ? pirSites().length : PIR_TYPES.length;
  document.getElementById('countBadge').innerHTML = `<strong>${n}</strong> ${pirGroupMode === 'location' ? 'Facilities' : 'PIR Types'}`;
}
window.setPirGroup = mode => {
  pirGroupMode = mode;
  document.getElementById('pirGB-location').classList.toggle('active', mode === 'location');
  document.getElementById('pirGB-type').classList.toggle('active', mode === 'type');
  renderPirDir();
};

/* ── Nav / view switching ── */
window.openNav  = () => { document.getElementById('navDrawer').classList.add('open'); document.getElementById('navBackdrop').classList.add('open'); };
window.closeNav = () => { document.getElementById('navDrawer').classList.remove('open'); document.getElementById('navBackdrop').classList.remove('open'); };
window.showView = view => {
  const fac = view === 'facilities';
  document.getElementById('facilitiesView').style.display = fac ? '' : 'none';
  document.getElementById('pirView').style.display = fac ? 'none' : '';
  document.getElementById('nav-facilities').classList.toggle('active', fac);
  document.getElementById('nav-pir').classList.toggle('active', !fac);
  document.getElementById('viewTagline').textContent = fac ? 'Facilities Dashboard' : 'PIR Directory';
  if (fac) { render(); }
  else { renderPirDir(); }
  window.closeNav();
};

render();
</script>
</body>
</html>
